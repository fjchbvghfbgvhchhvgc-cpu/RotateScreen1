 name: Build EXE                                                 
                                                                                                                                                                
on:                                                             
    push:
    workflow_dispatch:

jobs:                                                                                                                                                         
    build:
      runs-on: windows-latest                                                                                                                                   
      steps:                                                      
        - name: Checkout
          uses: actions/checkout@v4
                                                                                                                                                                
        - name: Setup .NET 8
          uses: actions/setup-dotnet@v4                                                                                                                         
          with:                                                   
            dotnet-version: '8.0.x'
                                                                                                                                                                
        - name: Publish single-file exe
          shell: pwsh                                                                                                                                           
          run: |                                                  
            dotnet publish RotateScreen/RotateScreen.csproj `
              -c Release `                                                                                                                                      
              -r win-x64 `
              --self-contained true `                                                                                                                           
              -p:PublishSingleFile=true `                                                                                                                       
              -p:EnableCompressionInSingleFile=true `
              -p:DebugType=embedded `                                                                                                                           
              -p:IncludeNativeLibrariesForSelfExtract=true `      
              -o out                                                                                                                                            
                                                                  
        - name: Show output                                                                                                                                     
          shell: pwsh                                             
          run: Get-ChildItem out | Format-Table Name, Length
                                                                                                                                                                
        - name: Upload EXE artifact
          uses: actions/upload-artifact@v4                                                                                                                      
          with:                                                   
            name: RotateScreen-exe
            path: out/RotateScreen.exe
            retention-days: 30            
